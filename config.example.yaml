# H3 Studio - copy to config.yaml and fill in the api_key.
# config.yaml is gitignored; the key stays server-side and never reaches the browser.

runpod:
  api_key: "YOUR_RUNPOD_API_KEY"

  # Tried in order until one is available. Cheapest-total first.
  # A card being "cheap per hour" is not the same as cheap per clip - what matters
  # is $/hr divided by clips/hr. Measured by `python -m app.calibrate`.
  gpu_preference:
    - "NVIDIA GeForce RTX 5090"    # ~$0.99/hr, native NVFP4 - suits the FP4 text encoder
    - "NVIDIA L40S"                # ~$0.86/hr, 48GB, roomiest of the cheap options
    - "NVIDIA RTX A6000"           # ~$0.49/hr, cheapest per hour but slowest

  cloud_type: "COMMUNITY"          # COMMUNITY is roughly half the price of SECURE
  interruptible: false             # spot pricing, ~30% off. The queue survives
                                   # interruptions (jobs requeue), so it is viable
                                   # for long unattended batches.

  image: "runpod/comfyui:1.4.7-cuda12.8"   # ComfyUI >= 0.30.0 has native MiniMax H3 nodes
  container_disk_gb: 120            # must hold ~40GB of weights + outputs

  # No network volume by default, on purpose. A persistent disk costs ~$0.07/GB/month
  # and bills even while the pod is off - about $10/month for this model. Re-downloading
  # ~40GB each session takes 2-5 min and costs ~5 cents. Only set this if you generate
  # most days, in which case the boot-time saving starts to pay for itself.
  network_volume_id: ""

  data_center_ids: []              # [] = wherever it's available.
                                   # Note: the H3 Community License reportedly excludes
                                   # local deployment in US/EU/UK/South Korea. Pick the
                                   # datacenter accordingly and read the license yourself.

# Only the pruned/quantised files - ~40GB total instead of ~130GB for full bf16.
weights:
  repo: "Comfy-Org/MiniMax-H3"
  # INT8 throughout, deliberately: it runs on Ampere (A6000), Ada (L40S) and
  # Blackwell (5090) alike. The nvfp4_awq encoder is smaller but Blackwell-only, so
  # it would break the moment the app fell back to a cheaper card.
  # Swap in the fp4/fp8 variants only if you pin gpu_preference to a 5090.
  files:
    - dst: "models/diffusion_models"
      src: "diffusion_models/minimax_h3_fl2va_pruned_int8_convrot.safetensors"
    - dst: "models/text_encoders"
      src: "text_encoders/qwen3vl_32b_minimax_h3_int8_convrot.safetensors"
    - dst: "models/vae"
      src: "vae/minimax_h3_video_vae_fp16.safetensors"
    - dst: "models/vae"
      src: "vae/minimax_h3_audio_vae_fp32.safetensors"
    # Turbo LoRA: 4 steps instead of 30. Roughly seven times less compute per clip,
    # which dwarfs every other cost lever in this project.
    - dst: "models/loras"
      src: "loras/minimax_h3_fl2v_turbo_4step_v1.0_768p_comfyui_bf16.safetensors"

pod:
  # The ON/OFF button is a policy, not a raw switch. This is what stops a pod
  # from being left running overnight.
  policy: "auto"                 # auto | keep-warm | off
  idle_shutdown_minutes: 10      # queue empty this long -> terminate
  max_session_hours: 6           # hard ceiling, kills the pod regardless
  boot_timeout_minutes: 35       # includes the weight download

generation:
  fps: 24
  default_seconds: 10            # H3 takes integers 4-15

  # Iterate cheap, render the keepers properly. Most of the money in video
  # generation goes to clips you throw away, so the draft preset is the real saving.
  presets:
    draft:
      width: 768
      height: 432
      steps: 20
    final:
      width: 1344
      height: 768
      steps: 30                  # open checkpoints are CFG-distilled; 30 is usually
                                 # indistinguishable from 50. Raise if you see artifacts.
  default_preset: "draft"

output:
  sink: "local_folder"           # local_folder | (later: s3)
  folder: "C:/Users/ORENS/Videos/h3out"
  # Any image saved into this folder is picked up as a reference image. Lets other
  # apps (Claude, ChatGPT, a screenshot tool) hand images over with no integration.
  inbox: "C:/Users/ORENS/h3studio/inbox"

budget:
  # Belt and braces against a runaway bill.
  session_limit_usd: 8.0         # orchestrator stops the pod when a session exceeds this
  warn_at_usd: 5.0

server:
  host: "127.0.0.1"              # 0.0.0.0 when this moves to a VPS for the team
  port: 8777
