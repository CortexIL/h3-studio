<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · H3 Studio</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="centred">
  <main class="login">
    <img class="login-logo" src="/static/logo.png" alt="">
    <div class="login-head">
      <h1>Sign in to H3 Studio</h1>
      <p>Use the account your administrator created for you.</p>
    </div>
    <form id="loginForm" class="login-card">
      <div class="login-field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="username" required autofocus>
      </div>
      <div class="login-field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <p id="loginError" class="banner banner-error" role="alert" hidden></p>
      <button class="btn-primary" type="submit" id="loginBtn">Sign in</button>
    </form>
    <p class="login-foot">No account? Ask your administrator — there is no public sign-up.</p>
  </main>
  <script type="module" src="/static/loginpage.js"></script>
</body>
</html>
