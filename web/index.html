<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>H3 Studio</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="studio">

<header class="topbar">
  <div class="brand">
    <img class="logo" src="/static/logo.png" alt="H3 Studio">
    <span class="brand-name">Studio</span>
    <span id="mockBadge" class="pill pill-warn" hidden>Demo — no GPU</span>
  </div>

  <nav class="topnav">
    <a href="/" class="active">Studio</a>
    <a href="/archive">Archive</a>
    <a href="/admin" id="adminLink" hidden>Admin</a>
  </nav>

  <div class="spacer"></div>

  <div class="gpu-readout">
    <span id="podDot" class="dot dot-off"></span>
    <div class="gpu-text">
      <span id="podState">Off</span>
      <span id="podDetail" class="dim"></span>
    </div>
  </div>

  <span id="who" class="dim"></span>
  <button id="signout" class="icon-btn danger" title="Sign out">⏻</button>
</header>

<div id="notice" class="banner" hidden></div>
<div id="error" class="banner banner-error" hidden></div>

<main class="layout">

  <!-- ─────────────── create ─────────────── -->
  <section class="col col-create" id="composePanel">
    <div class="col-head">
      <h2>Create</h2>
      <div class="spacer"></div>
      <button id="clearCompose" class="icon-btn" title="Clear the form">✕</button>
    </div>

    <div class="col-body">
      <div class="field">
        <label class="lbl">Reference images</label>
        <div id="refTiles" class="tiles">
          <label class="tile tile-add" title="Add images, a .zip, or a batch file">
            <input type="file" id="refInput" accept="image/*,.zip,.json,.txt" multiple hidden>
            <span>+</span>
          </label>
        </div>
        <p class="hint tiny">Drag anywhere on this panel · Ctrl+V pastes · .zip works too</p>
      </div>

      <div class="field grow">
        <div class="field-head">
          <label class="lbl" for="prompts">Prompt</label>
          <div class="spacer"></div>
          <div class="segmented tiny" role="group" aria-label="How to read the box">
            <button class="seg spl active" data-split="single"
                    title="The whole box is one prompt, line breaks included">1 prompt</button>
            <button class="seg spl" data-split="lines"
                    title="Every line becomes its own clip">Line = clip</button>
          </div>
        </div>
        <textarea id="prompts" spellcheck="false"
          placeholder="Describe the shot. Line breaks are fine.&#10;&#10;Switch to “Line = clip” to queue many at once, one per line."></textarea>
      </div>

      <div class="field">
        <label class="lbl">Settings</label>
        <div class="chips">
          <label class="chip">
            <span class="chip-ico">◷</span>
            <input type="number" id="seconds" min="4" max="15" value="10">
            <span class="chip-unit">s</span>
          </label>
          <label class="chip">
            <span class="chip-ico">◈</span>
            <select id="preset"></select>
          </label>
          <label class="chip">
            <span class="chip-ico">⧉</span>
            <input type="number" id="count" min="1" max="10" value="1">
            <span class="chip-unit">takes</span>
          </label>
          <label class="chip wide">
            <span class="chip-ico">▷</span>
            <select id="mode">
              <option value="t2v">Text → video</option>
              <option value="i2v" selected>Image → video</option>
              <option value="r2v">Reference → video</option>
            </select>
          </label>
        </div>
      </div>

      <div id="estimate" class="estimate"></div>
    </div>

    <div class="col-foot">
      <button id="submit" class="btn-primary">
        <span>Add to queue</span>
        <span id="submitCost" class="btn-cost"></span>
      </button>
    </div>

    <div id="dropHint" class="drophint"><span>Drop images, a .zip, or a batch</span></div>
  </section>

  <!-- draggable divider -->
  <div id="resizer" class="resizer" role="separator" aria-orientation="vertical"
       title="Drag to resize"></div>

  <!-- ─────────────── feed: queue and history, one stream ─────────────── -->
  <section class="col col-feed">
    <div class="col-head">
      <h2>Queue &amp; history</h2>
      <div id="counts" class="counts"></div>
      <div class="spacer"></div>
      <div class="segmented small" id="filters">
        <button class="seg flt active" data-filter="all">All</button>
        <button class="seg flt" data-filter="pending">Pending</button>
        <button class="seg flt" data-filter="done">Ready</button>
      </div>
      <button id="clearDone" class="icon-btn" title="Remove finished entries from the list">🗑</button>
    </div>
    <div class="col-body">
      <div id="feed" class="feed"></div>
    </div>
  </section>
</main>

<script type="module" src="/static/app.js"></script>
</body>
</html>
